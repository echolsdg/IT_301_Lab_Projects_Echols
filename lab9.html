<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Page Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    header, main, footer {
      padding: 20px;
      margin-bottom: 20px;
    }

    header {
      background-color: #004466;
      color: white;
      text-align: center;
    }

    main {
      background-color: #f0f0f0;
    }

    footer {
      background-color: #ccc;
      text-align: center;
    }

    nav ul {
      display: flex;
      gap: 10px;
      list-style: none;
      justify-content: center;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      background-color: #006699;
      padding: 10px 15px;
      border-radius: 4px;
    }

    img {
      max-width: 500px;
      width: 100%;
      display: block;
      margin: 20px auto;
    }

    /* Your media queries go below */
    @media (min-width: 500px) and (max-width: 800px) {
      main { background-color: #006699;}
      img{ width:100%;}
    }

    @media (max-width:500px) {
        main{background-color:bisque}
        img{width:100%;}
        ul {display: flex;
            flex-direction: column;}
        
        nav ul li{
            border-bottom: 2px solid white;
            background-color:#1d80b2;
    
        }

        nav ul li a {padding:0px;
        background-color:#1d80b2;
    }
    }
 

  </style>
</head>
<body>

  <header>
    <h1>My Responsive Web Page</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <p>This is the main content area. Resize the screen to see the responsive layout change!</p>
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Nature">
  </main>

  <footer>
    <p>&copy; 2025 Nareman Hamdan </p>
  </footer>

</body>
</html>
