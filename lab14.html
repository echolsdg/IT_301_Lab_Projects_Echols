<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 14 - Fetch and APIs</title>
</head>
<body>

    <h1>Profile Generator</h1>
    <p>Welcome to my page that contains user profiles!</p>


    <script>

       let name = document.createElement('h2');
       let email = document.createElement('p');
       let phone = document.createElement('p');
       let img = document.createElement('img');
       let bttn = document.createElement('button');
       bttn.type = "button";
       bttn.textContent = "Generate Profile";
       let form = document.createElement('form');
       form.action = "#";
       form.appendChild(bttn);
       document.body.appendChild(form);
       
       const createImage = async()=>{
            let p = await fetch('https://randomuser.me/api/');
            p = await p.json();

            let user = p.results[0];
            img.src = user.picture.large;
            img.alt = "User Profile";

            name.textContent = user.name.first + " " + user.name.last;
            email.textContent = user.email;
            phone.textContent = user.phone;

            console.log(p);
            console.log(user);
            img.style.width = '400px';
            document.body.appendChild(img);
            document.body.appendChild(name);
            document.body.appendChild(email);
            document.body.appendChild(phone);
       }
       bttn.addEventListener('click', createImage);
    
    </script>
</body>
</html>
